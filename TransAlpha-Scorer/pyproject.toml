[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transalpha-scorer"
version = "1.1.0"
description = "TransAlpha小组个股多维度融合打分系统"
requires-python = ">=3.8"
dependencies = [
    "akshare>=1.18.0",
    "baostock>=0.9.0",
    "efinance>=0.5.0",
    "requests>=2.28.0",
    "pandas>=1.4.0",
    "numpy>=1.22.0",
    "openpyxl>=3.0.0",
]

[project.scripts]
transalpha-score = "transalpha.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
